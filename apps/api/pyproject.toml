[project]
name = "textileops-api"
version = "0.1.0"
description = "TextileOps — AI-native operations control system for textile manufacturing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "openpyxl>=3.1.5",
    "pypdf>=5.0.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-python-dateutil",
]

[project.scripts]
textileops = "textileops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["textileops"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI dependency defaults are the framework's idiom.
    "RUF012",  # SQLAlchemy __table_args__ are tuples by design.
    "SIM108",  # A ternary is not always clearer than an if/else.
    "B904",    # Domain errors deliberately replace the provider exception.
    # The domain documentation uses real multiplication and minus signs
    # (0.297 kg × 5,000 m; on-hand − reserved). Mangling them into ASCII would
    # make the arithmetic harder to read, which is the opposite of the point.
    "RUF001",
    "RUF002",
    "RUF003",
    # `class X(str, Enum)` is required: SQLAlchemy stores the member *value*,
    # and enum.StrEnum changes __str__ in ways the mappings rely on.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = "(alembic/|tests/)"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "ai_live: tests that require a real Anthropic API key and network access",
]
filterwarnings = ["ignore::DeprecationWarning"]
