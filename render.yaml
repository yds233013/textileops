# Render Blueprint for the hosted TextileOps demo — free plans only.
#
#   Render dashboard → New → Blueprint → select this repository.
#
# One service and a database, both on Render's free plans. Nothing here can
# incur a charge.
#
#   textileops       web, public   ONE container (deploy/render/Dockerfile):
#                                  Next.js on $PORT — the only thing a visitor
#                                  reaches — proxying /api/v1 to FastAPI on
#                                  127.0.0.1, with the worker as a thread.
#   textileops-db                  Managed PostgreSQL 16.
#
# Why one container: private services and background workers have no free
# plan. The boundary is the same — the API has no public address, the browser
# only ever talks to the web origin — and uploads land on the same filesystem
# the worker reads. To split them for a real deployment, use apps/api/Dockerfile
# and apps/web/Dockerfile (see infra/docker-compose.prod.yml, docs/DEPLOYMENT.md).
#
# What the free plans mean (docs/DEPLOYMENT.md, "Free-tier limitations"):
#   * the service sleeps after 15 minutes without a request; the next visitor
#     waits while it wakes, and TextileOps says so on screen;
#   * a tenth of a CPU and 512 MB, so pages are slower than on a paid instance;
#   * the free database expires 30 days after creation (14 more to upgrade
#     before deletion) and holds 1 GB. The demo reseeds an empty database by
#     itself, so replacing it is: delete it, re-sync this Blueprint.
#
# This file configures a DEMO: DEMO_MODE=true, one-click sign-in, fictional data
# that reloads daily and after visitors have changed it and left. For a real
# business, remove DEMO_MODE, set PILOT_MODE=true, create real users, and read
# docs/DEPLOYMENT.md first.

databases:
  - name: textileops-db
    databaseName: textileops
    user: textileops
    postgresMajorVersion: "16"
    plan: free

services:
  - type: web
    name: textileops
    runtime: docker
    # Both paths are relative to the repository root.
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    plan: free
    # Through the web server and its proxy to the API and the database: green
    # means the whole chain works, not only that Node is up.
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: textileops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: PILOT_MODE
        value: "false"
      # The rule engine, deliberately: a public demo must not let any visitor
      # spend on a model account. No model key is configured on this service.
      - key: AI_PROVIDER
        value: stub
      - key: CORS_ORIGINS
        value: https://textileops.onrender.com
      # 512 MB holds three processes; one API worker process is plenty for a demo.
      - key: WEB_CONCURRENCY
        value: "1"
