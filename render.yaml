# Render Blueprint for the hosted TextileOps demo.
#
#   Render dashboard → New → Blueprint → select this repository.
#
# One service and a database:
#
#   textileops       web, public   ONE container (deploy/render/Dockerfile):
#                                  Next.js on $PORT — the only thing a visitor
#                                  reaches — proxying /api/v1 to FastAPI on
#                                  127.0.0.1, plus the background worker.
#   textileops-db                  Managed PostgreSQL 16.
#
# Why one container: a private service and a background worker each need their
# own paid instance, and a demo does not need them scaled apart. The boundary
# is the same — the API has no public address, the browser only ever talks to
# the web origin — and uploads land on the same filesystem the worker reads.
# To split them for a real deployment, use apps/api/Dockerfile and
# apps/web/Dockerfile (see infra/docker-compose.prod.yml and docs/DEPLOYMENT.md).
#
# This file configures a DEMO: DEMO_MODE=true, one-click sign-in, fictional data
# that reloads daily and after visitors have changed it and left. For a real
# business, remove DEMO_MODE, set PILOT_MODE=true, create real users, and read
# docs/DEPLOYMENT.md first.
#
# Plans and prices change; check them in the dashboard. Plan names follow the
# Blueprint spec (render.com/docs/blueprint-spec). The free web plan sleeps
# after 15 idle minutes and the free database is deleted after 30 days, which
# is why neither is used for a link meant to be sent to people.

databases:
  - name: textileops-db
    databaseName: textileops
    user: textileops
    postgresMajorVersion: "16"
    plan: 0.1c-256mb

services:
  - type: web
    name: textileops
    runtime: docker
    # Both paths are relative to the repository root.
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    # Through the web server and its proxy to the API and the database: green
    # means the whole chain works, not only that Node is up.
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: textileops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: PILOT_MODE
        value: "false"
      # The rule engine, deliberately: a public demo must not let any visitor
      # spend on a model account. No model key is configured on this service.
      - key: AI_PROVIDER
        value: stub
      - key: CORS_ORIGINS
        value: https://textileops.onrender.com
      # 512 MB holds three processes; one API worker process is plenty for a demo.
      - key: WEB_CONCURRENCY
        value: "1"
